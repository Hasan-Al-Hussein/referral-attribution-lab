<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Referral Attribution Lab architecture</title>
  <desc id="desc">Layered architecture separating experience, orchestration, domain policy, durable storage, and platform adapters.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F3F7F7"/><stop offset="1" stop-color="#E8F2F4"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#52737A"/></marker><style>.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,Menlo,monospace}.box{fill:#fff;stroke:#D2E0E0;stroke-width:2}.label{font-size:13px;font-weight:800;letter-spacing:1px}.title{font-size:20px;font-weight:800;fill:#102A2E}.copy{font-size:13px;fill:#486267}</style></defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="56" y="70" class="sans" font-size="30" font-weight="800" fill="#102A2E">Architecture and trust boundaries</text><text x="56" y="99" class="sans" font-size="15" fill="#61777B">One coordinator, strict input policy, durable receipts, platform-specific delivery.</text>
  <g class="sans">
    <rect class="box" x="56" y="144" width="1088" height="92" rx="20"/><text x="84" y="174" class="label" fill="#08725A">EXPERIENCE</text><text x="84" y="207" class="title">Invite</text><text x="252" y="207" class="title">Referred onboarding</text><text x="528" y="207" class="title">Verified completion</text><text x="822" y="207" class="title">Visible event ledger</text>
    <rect x="56" y="278" width="1088" height="112" rx="20" fill="#102A2E"/><text x="84" y="310" class="label" fill="#5DD6C7">APPLICATION</text><text x="84" y="350" font-size="24" font-weight="800" fill="#EFF9F8">ReferralCoordinator</text><text x="363" y="350" font-size="14" fill="#B8CCCE">serializes callbacks and signup</text><text x="655" y="350" font-size="14" fill="#B8CCCE">persists before routing</text><text x="876" y="350" font-size="14" fill="#B8CCCE">replays safely</text>
    <rect class="box" x="56" y="432" width="332" height="156" rx="20"/><text x="84" y="464" class="label" fill="#0B8178">DOMAIN POLICY</text><text x="84" y="500" class="title">Strict parser</text><text x="84" y="526" class="copy">allowlisted destination</text><text x="84" y="548" class="copy">normalized referral identity</text><text x="84" y="570" class="copy">30-day attribution window</text>
    <rect class="box" x="434" y="432" width="332" height="156" rx="20"/><text x="462" y="464" class="label" fill="#397FAD">DURABILITY</text><text x="462" y="500" class="title">AsyncStorage records</text><text x="462" y="526" class="copy">epoch-scoped state</text><text x="462" y="548" class="copy">analytics outbox and receipts</text><text x="462" y="570" class="copy">journey milestone hydration</text>
    <rect class="box" x="812" y="432" width="332" height="156" rx="20"/><text x="840" y="464" class="label" fill="#D87532">PLATFORM ADAPTERS</text><text x="840" y="500" class="title">Web and native</text><text x="840" y="526" class="copy">Branch deep links</text><text x="840" y="548" class="copy">Firebase Analytics</text><text x="840" y="570" class="copy">Web Share or native Share</text>
  </g>
  <g fill="none" stroke="#52737A" stroke-width="2" marker-end="url(#arrow)"><path d="M600 236v38"/><path d="M600 390v30"/><path d="M600 420c0-10-378-10-378 0v8"/><path d="M600 420v8"/><path d="M600 420c0-10 378-10 378 0v8"/></g>
  <g transform="translate(56 622)"><rect width="1088" height="28" rx="14" fill="#DDF3EF"/><text x="544" y="19" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#075F5B">THE MOBILE CLIENT PRESERVES ATTRIBUTION. AN AUTHORITATIVE BACKEND OWNS ELIGIBILITY AND REWARDS.</text></g>
</svg>
