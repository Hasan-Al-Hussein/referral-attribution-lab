<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Referral journey state machine</title><desc id="desc">The accepted path and explicit failure branches of the referral journey.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091518"/><stop offset="1" stop-color="#0B3443"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#52737A"/></marker><style>.s{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,Menlo,monospace}.n{fill:#102126;stroke:#52737A;stroke-width:2}.t{font-size:14px;font-weight:800;fill:#EFF9F8}.c{font-size:11px;fill:#91AAAD}</style></defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/><text x="56" y="65" class="s" font-size="28" font-weight="800" fill="#EFF9F8">Deterministic journey state machine</text><text x="56" y="94" class="s" font-size="14" fill="#B8CCCE">Accepted events advance the signal. Failures remain explicit and retryable.</text>
  <g class="s" text-anchor="middle">
    <g transform="translate(150 185)"><rect class="n" x="-82" y="-38" width="164" height="76" rx="17"/><text class="t" y="-4">GENERATED</text><text class="c" y="19">stable member code</text></g>
    <g transform="translate(375 185)"><rect class="n" x="-82" y="-38" width="164" height="76" rx="17"/><text class="t" y="-4">SHARED</text><text class="c" y="19">actual outcome only</text></g>
    <g transform="translate(600 185)"><rect class="n" x="-82" y="-38" width="164" height="76" rx="17"/><text class="t" y="-4">RESOLVED</text><text class="c" y="19">strict callback parse</text></g>
    <g transform="translate(825 185)"><rect class="n" x="-82" y="-38" width="164" height="76" rx="17"/><text class="t" y="-4">STARTED</text><text class="c" y="19">identity frozen</text></g>
    <g transform="translate(1050 185)"><rect x="-82" y="-38" width="164" height="76" rx="17" fill="#143E3B" stroke="#5DD6C7" stroke-width="2"/><text class="t" y="-4">COMPLETED</text><text class="c" y="19">receipt persisted</text></g>
    <g transform="translate(600 330)"><rect x="-180" y="-32" width="360" height="64" rx="16" fill="#49331E" stroke="#F0A15C"/><text class="t" y="-4">REJECTED / DUPLICATE / RETRY</text><text class="c" y="18">diagnostics without silent navigation</text></g>
  </g>
  <g fill="none" stroke="#52737A" stroke-width="2" marker-end="url(#a)"><path d="M234 185h57"/><path d="M459 185h57"/><path d="M684 185h57"/><path d="M909 185h57"/><path d="M600 225v68"/></g>
</svg>
